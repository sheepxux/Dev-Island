# Release pipeline for Dev Island (bundle: "Dev Island.app").
#
# Trigger: pushing a tag matching `v*` (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Output: a signed + notarized + stapled DMG (primary, drag-to-Applications
# install UX) and zip (stable direct-download URL + future Sparkle feed)
# attached to a GitHub Release, plus a signed Sparkle appcast, an atomically
# generated SHA-256 manifest, and GitHub build provenance binding every
# published artifact to this tagged workflow run.
#
# Why a single job:
# - codesign + notarytool + stapler all need a signed-in keychain on the SAME
#   runner. Splitting these into separate jobs would force re-importing the
#   .p12 into a fresh keychain per job, which is fragile and slower than just
#   doing the whole pipeline on one mac runner.
#
# Required GitHub Secrets (configure under Settings → Secrets and variables → Actions):
#
#   APPLE_ID                       — your Apple ID email (used for notarytool auth)
#   APPLE_TEAM_ID                  — 10-char Team ID from developer.apple.com
#   APPLE_APP_PASSWORD             — app-specific password from appleid.apple.com,
#                                    NOT your Apple ID login password. Generate
#                                    a new one labeled "Island Notarization".
#   SIGNING_CERTIFICATE_P12_BASE64 — your "Developer ID Application" cert
#                                    exported as .p12 from Keychain Access,
#                                    then base64-encoded:
#                                       base64 -i cert.p12 | pbcopy
#   SIGNING_CERTIFICATE_P12_PASSWORD — the password set when exporting the .p12
#   KEYCHAIN_PASSWORD              — anything; just used to lock the temporary
#                                    keychain we create on the runner. e.g. a
#                                    20-char random string.
#   SPARKLE_PUBLIC_ED_KEY           — base64 Ed25519 public key emitted by
#                                    Sparkle's generate_keys tool. Embedded in
#                                    the signed app; public material, stored as
#                                    a secret only to keep release setup atomic.
#   SPARKLE_PRIVATE_ED_KEY          — private Ed25519 key exported by
#                                    generate_keys. Never print or commit it.

name: Release

on:
  push:
    tags:
      - 'v*'

# Serialize all releases, not only runs for the same tag. Two tags publishing
# concurrently can race the stable asset names and `releases/latest` appcast.
concurrency:
  group: release
  cancel-in-progress: false

# `contents: write` publishes the reviewed Release. The two narrowly scoped
# OIDC permissions let GitHub create Sigstore-backed build provenance for the
# exact local artifact digests; they do not expose a reusable signing secret.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-sign-release:
    name: Build, sign, notarize, release
    # macos-15 = Sequoia, ships Xcode 16 with Swift 6. We need Swift 6
    # specifically because Hummingbird 2.16's transitive dep
    # swift-async-algorithms 1.1.3 uses typed throws (`throws(Failure)`)
    # and the `#isolation` macro, both Swift 6 features. Xcode 15.4 /
    # Swift 5.10 chokes on these — see the v0.1.0 attempt that failed
    # at AsyncFlatMapLatestSequence.swift:85.
    runs-on: macos-15
    # 90 not 30 because notarytool's wait can take 20-40 minutes when
    # Apple's queue is busy (we hit a 20m timeout on the first valid
    # v0.1.0 attempt with submission still "In Progress") — and we now
    # notarize TWICE (the .app, then the DMG wrapping it). Build itself
    # completes in 5-10 min on a cold runner, codesign and stapler are
    # near-instant, so the rest of the budget is all notarization slack.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job needs contents:write only for the final publication action.
          # Repository-owned gates must never inherit a reusable Git credential
          # from checkout while they execute code from the tagged revision.
          persist-credentials: false

      # macos-15 default Xcode at the time of writing is 16.x (Swift 6).
      # We deliberately do NOT pin a specific Xcode_X.Y.app path because
      # GitHub rotates point releases on the runner image and the path
      # `Xcode_16.4.app` may disappear without notice. The fast-moving
      # Swift 6 toolchain version isn't load-bearing for us as long as
      # it's >=6.0; if we ever need an exact pin, drop a `.swift-version`
      # file at repo root.
      - name: Verify Xcode + Swift
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            command -v brew >/dev/null 2>&1
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version
          xcodebuild -version
          swift --version

      # A tag can point to any commit, including one that never passed the
      # main-branch workflow. Run all repository-owned gates before importing
      # signing identities or exposing release secrets to later steps.
      - name: Repository release gates
        run: |
          set -euo pipefail
          ./scripts/release/verify-workflow-checkout-isolation.rb \
            --workflow .github/workflows/release.yml
          ./scripts/release/verify-workflow-run-shells.rb \
            --workflow .github/workflows/ci.yml
          ./scripts/release/verify-workflow-run-shells.rb \
            --workflow .github/workflows/release.yml
          ./scripts/release/verify-repository-script-syntax.rb
          git ls-files --error-unmatch Package.resolved >/dev/null
          test -f Package.resolved && test ! -L Package.resolved
          swift package resolve
          git diff --exit-code -- Package.resolved
          ./scripts/ci/verify-sparkle-old-to-new-update.sh
          ./scripts/ci/verify-security-invariants.sh
          ./scripts/ci/verify-app-bundle-dependencies.sh
          ./scripts/release/verify-brand-assets.rb \
            --manifest scripts/assets/agent-logos/manifest.json \
            --trademark-reviews scripts/assets/agent-logos/trademark-reviews.json \
            --source-dir scripts/assets/agent-logos \
            --bundle-dir IslandApp/Resources \
            --licenses-dir scripts/licenses \
            --require-release-reviewed
          ./scripts/ci/run-authoritative-tests.sh
          git diff --check

      # Read the version once so subsequent steps can reference it. The
      # tag (refs/tags/v0.1.0) and the VERSION file should match — we
      # assert they do as a guardrail against a tag/file mismatch shipping
      # the wrong version string into Info.plist.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          git ls-files --error-unmatch VERSION >/dev/null
          git ls-files --error-unmatch scripts/release/validate-product-version.rb >/dev/null
          test "${GITHUB_REF_NAME}" != "${GITHUB_REF_NAME#v}"
          TAG_VERSION="$(./scripts/release/validate-product-version.rb \
            --version "${GITHUB_REF_NAME#v}")"
          FILE_VERSION="$(./scripts/release/validate-product-version.rb \
            --version-file VERSION)"
          if [[ "${TAG_VERSION}" != "${FILE_VERSION}" ]]; then
            echo "::error::Tag (${TAG_VERSION}) does not match VERSION file (${FILE_VERSION})"
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      # Fail before importing a certificate or creating release artifacts if
      # any part of the production trust chain is missing. Values are never
      # printed; the Sparkle keys must also complete a real sign/verify
      # challenge so two individually well-formed but unrelated keys fail.
      - name: Validate release credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          ./scripts/ci/validate-release-credentials.sh

      # Import the signing certificate into a temporary keychain.
      # Why a temporary keychain (not the default one):
      #   - Default login.keychain on the runner image is unlocked at boot
      #     with a password that may rotate; if we add the cert there it
      #     won't unlock after suspend/resume of background steps.
      #   - A scoped keychain we create + delete in the same run is also
      #     better hygiene: secrets don't leak into other concurrent jobs
      #     on the same runner pool.
      - name: Setup signing keychain
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/signing.p12"

          printf '%s' "${P12_BASE64}" | base64 --decode -o "${CERT_PATH}"

          # Sanity-check the decoded file before handing it to security(1):
          # if the base64 secret was somehow truncated or whitespace-mangled
          # in transit, the decoded file is junk and `security import` fails
          # with "Unknown format in import" — which looks like a credential
          # problem but is really an upstream encoding problem. Print
          # `file` output so the failure mode is obvious in the log.
          file "${CERT_PATH}" || true
          ls -la "${CERT_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          # `-t agg` is the right type for a PKCS#12 file (it contains
          # *both* a cert and a private key — `-t cert` told security to
          # treat the input as a certificate-only blob, which fails with
          # "Unknown format in import" for real .p12 files).
          # `-T /usr/bin/codesign` whitelists codesign to use the imported
          # private key without an interactive password prompt, which the
          # CI runner can't satisfy.
          security import "${CERT_PATH}" \
            -P "${P12_PASSWORD}" \
            -A -t agg -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "${KEYCHAIN_PATH}"

          rm -f "${CERT_PATH}"

          # Surface the discovered identity name so subsequent codesign
          # invocations can reference it. Should look like
          # "Developer ID Application: <Your Name> (TEAM_ID)".
          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
            | grep "Developer ID Application" \
            | head -1 | awk -F'"' '{print $2}')"
          if [[ -z "${IDENTITY}" ]]; then
            echo "::error::No 'Developer ID Application' identity found after import"
            exit 1
          fi
          echo "SIGNING_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"

      - name: Build .app (universal)
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY}" ]]; then
            echo "::error::SPARKLE_PUBLIC_ED_KEY is required for release builds"
            exit 1
          fi
          ./scripts/build-app.sh

      # build-app.sh already runs this fail-closed before its local ad-hoc
      # signature. Repeat it as an explicit tagged-release boundary so the
      # signed/notarized artifact can never depend on a developer machine,
      # a missing framework, an escaping symlink, or a thin architecture.
      - name: Verify app dependency closure
        run: |
          set -euo pipefail
          ./scripts/release/verify-app-bundle-dependencies.rb \
            --app "build/Dev Island.app"
          ./scripts/release/verify-brand-assets.rb \
            --manifest scripts/assets/agent-logos/manifest.json \
            --trademark-reviews scripts/assets/agent-logos/trademark-reviews.json \
            --source-dir scripts/assets/agent-logos \
            --bundle-dir "build/Dev Island.app/Contents/Resources" \
            --licenses-dir "build/Dev Island.app/Contents/Resources/ThirdPartyLicenses" \
            --require-release-reviewed

      # Override the ad-hoc signature from build-app.sh with the real
      # Developer ID one. We re-sign rather than passing the identity into
      # build-app.sh because the script is designed to be runnable locally
      # (where developers don't have the prod cert) — keeping signing
      # outside the script preserves that property.
      - name: Codesign with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The bundle filename is "Dev Island.app" — must quote the
          # path everywhere downstream because of the space.
          APP="build/Dev Island.app"
          SPARKLE="${APP}/Contents/Frameworks/Sparkle.framework"

          # This repo builds an app bundle outside Xcode, so sign Sparkle's
          # nested code explicitly in leaf-to-root order. Sparkle warns
          # against --deep for distribution because it can erase helper
          # entitlements and conceal an incomplete signing graph.
          codesign --force --options runtime \
            --sign "${SIGNING_IDENTITY}" --timestamp \
            "${SPARKLE}/Versions/B/XPCServices/Installer.xpc"
          codesign --force --options runtime \
            --preserve-metadata=entitlements \
            --sign "${SIGNING_IDENTITY}" --timestamp \
            "${SPARKLE}/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --options runtime \
            --sign "${SIGNING_IDENTITY}" --timestamp \
            "${SPARKLE}/Versions/B/Autoupdate"
          codesign --force --options runtime \
            --sign "${SIGNING_IDENTITY}" --timestamp \
            "${SPARKLE}/Versions/B/Updater.app"
          codesign --force --options runtime \
            --sign "${SIGNING_IDENTITY}" --timestamp "${SPARKLE}"

          codesign --force --options runtime \
            --sign "${SIGNING_IDENTITY}" \
            -i app.devisland.Island \
            --timestamp \
            "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign -dv --verbose=4 "${APP}" 2>build/app-signature-metadata.txt
          if ! grep -Fqx "TeamIdentifier=${APPLE_TEAM_ID}" build/app-signature-metadata.txt; then
            echo "::error::Signed App TeamIdentifier does not match APPLE_TEAM_ID"
            exit 1
          fi
          # spctl is the Gatekeeper assessment tool — pre-notarization
          # this should output "rejected (Unnotarized Developer ID)",
          # which is the *correct* state. Notarization in the next step
          # is what flips it to "accepted".
          spctl -a -vv -t exec "build/Dev Island.app" || true

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # notarytool requires a zip (or .pkg / .dmg). Apple's docs say
          # `ditto -c -k --keepParent` produces the canonical zip layout
          # they expect — `zip` itself produces a zip too but with
          # different metadata that occasionally trips notarytool.
          ditto -c -k --keepParent "build/Dev Island.app" build/Dev-Island-notarization.zip

          # 45m, not 20m — Apple's queue varies wildly (median 5-10 min,
          # tail can hit 30+ min especially for new Developer IDs that
          # haven't built reputation yet). The v0.1.0 first attempt
          # timed out at 20 min with submission b3b8e1d3 still "In
          # Progress" on Apple's side. Job-level timeout in the runner
          # config (60m) bounds the overall run if Apple goes catastrophic.
          xcrun notarytool submit build/Dev-Island-notarization.zip \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait \
            --timeout 45m

          # Staple the notarization ticket onto the .app so users with
          # no internet can still verify the notarization. After this,
          # `xcrun stapler validate` should print "The validate action
          # worked!".
          xcrun stapler staple "build/Dev Island.app"
          xcrun stapler validate "build/Dev Island.app"
          codesign --verify --deep --strict --verbose=2 "build/Dev Island.app"
          spctl -a -vvv -t exec "build/Dev Island.app"

      # Launch the exact notarized production App from a frozen private copy.
      # The paired argument/environment opt-in renders the real shipping UI
      # while keeping Keychain, SQLite, local Hooks, Manus, notifications and
      # Sparkle inert. All acceptance fields stay in this process's shell
      # memory; runner-temporary evidence paths are never publication inputs.
      - name: Hermetically launch notarized production app
        run: |
          set -euo pipefail
          production_summary="$(
            ./scripts/qa/measure-app-performance.sh \
              "build/Dev Island.app/Contents/MacOS/IslandApp" \
              production-launch-smoke \
              "${RUNNER_TEMP}/dev-island-notarized-production-launch.csv" \
              0 8
          )"
          for invariant in \
            'scenario=production-launch-smoke' \
            'launch_profile=production-hermetic' \
            'production_services_isolated=true' \
            'isolated_user_home=true' \
            'isolated_app_snapshot=true' \
            'normal_termination=true' \
            'app_exit_status=0' \
            'sample_count=8'; do
            grep -Fqx "$invariant" <<<"$production_summary"
          done
          private_executable_sha256="$(sed -n 's/^executable_sha256=//p' \
            <<<"$production_summary")"
          selected_executable_sha256="$(sed -n 's/^selected_executable_sha256=//p' \
            <<<"$production_summary")"
          [[ "$private_executable_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$selected_executable_sha256" = "$private_executable_sha256"

      # Primary user-facing artifact: a DMG with the customary macOS
      # install experience — open it and you get the app icon next to an
      # Applications shortcut, drag once, done.
      #
      # Three details that are easy to get wrong:
      #   - The DMG must be built AFTER the .app is stapled, so offline
      #     Gatekeeper verification works for the copy users drag out.
      #   - The DMG file itself must be codesigned AND notarized AND
      #     stapled separately from the .app — otherwise Gatekeeper warns
      #     on the DMG even though its contents are clean.
      #   - create-dmg (shell tool, via Homebrew) occasionally exits 2
      #     when AppleScript window-dressing flakes on a headless runner
      #     even though the DMG was written correctly, so we verify the
      #     output file exists instead of trusting the exit code.
      - name: Package + notarize DMG
        id: dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          STABLE_DMG="build/Dev-Island.dmg"
          VERSIONED_DMG="build/Dev-Island-${VERSION}.dmg"

          brew install create-dmg

          # Background: 1320×800 PNG with 144 DPI metadata → Finder renders
          # it at 660×400 logical points, crisp on retina. Icon coordinates
          # center each icon inside the two rounded squares of the artwork
          # (app left, Applications right, arrow between).
          create-dmg \
            --volname "Dev Island" \
            --background "scripts/assets/dmg-background@2x.png" \
            --window-pos 200 160 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Dev Island.app" 157 205 \
            --app-drop-link 500 205 \
            --hide-extension "Dev Island.app" \
            "${STABLE_DMG}" \
            "build/Dev Island.app" \
            || true
          [[ -f "${STABLE_DMG}" ]] || { echo "::error::create-dmg produced no output"; exit 1; }

          codesign --force --sign "${SIGNING_IDENTITY}" --timestamp "${STABLE_DMG}"
          codesign --verify --strict --verbose=2 "${STABLE_DMG}"

          xcrun notarytool submit "${STABLE_DMG}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait \
            --timeout 45m
          xcrun stapler staple "${STABLE_DMG}"
          xcrun stapler validate "${STABLE_DMG}"
          codesign --verify --strict --verbose=2 "${STABLE_DMG}"
          spctl -a -vvv -t open --context context:primary-signature "${STABLE_DMG}"

          cp "${STABLE_DMG}" "${VERSIONED_DMG}"
          SHA256="$(shasum -a 256 "${STABLE_DMG}" | awk '{print $1}')"
          ls -lh "${STABLE_DMG}" "${VERSIONED_DMG}"
          echo "stable=${STABLE_DMG}" >> "${GITHUB_OUTPUT}"
          echo "versioned=${VERSIONED_DMG}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"

      # Secondary artifact: zip. Use `ditto` again for the same reason:
      # consistent metadata, predictable extraction layout when users
      # double-click the zip from Safari.
      #
      # We produce TWO assets on each release:
      #
      #   Dev-Island.zip            — stable filename. Resolves through
      #                               https://.../releases/latest/download/Dev-Island.zip
      #                               which is the permanent URL the landing
      #                               page links to; never needs version-bumping.
      #   Dev-Island-<VERSION>.zip  — version-stamped archive. Useful for
      #                               pinning a specific build (issue triage,
      #                               reproducibility) when Dev-Island.zip has
      #                               already moved to a newer release.
      #
      # Both contain the exact same notarized .app — they're literal
      # copies of each other, just with different filenames so the
      # Releases page and the landing page can each use the convention
      # that suits them.
      - name: Package release zip
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # Filenames intentionally use a hyphen (Dev-Island.zip) rather
          # than the bundle's space-separated name (Dev Island.app):
          # URLs with %20 escaping look untrustworthy to a casual user
          # hovering the download link, and the hyphenated form matches
          # the GitHub repo name (Dev-Island), so the URL reads
          # consistently across the homepage, the repo, and the cask.
          STABLE="build/Dev-Island.zip"
          VERSIONED="build/Dev-Island-${VERSION}.zip"
          ditto -c -k --keepParent "build/Dev Island.app" "${STABLE}"
          cp "${STABLE}" "${VERSIONED}"
          SHA256="$(shasum -a 256 "${STABLE}" | awk '{print $1}')"
          ls -lh "${STABLE}" "${VERSIONED}"
          echo "Stable artifact:    ${STABLE}"
          echo "Versioned artifact: ${VERSIONED}"
          echo "SHA-256:            ${SHA256}"
          echo "stable=${STABLE}" >> "${GITHUB_OUTPUT}"
          echo "versioned=${VERSIONED}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Render release-pinned Homebrew Cask
        id: cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          OUTPUT: build/dev-island.rb
        run: |
          set -euo pipefail
          ./scripts/render-homebrew-cask.sh
          echo "path=${OUTPUT}" >> "${GITHUB_OUTPUT}"

      - name: Generate signed Sparkle appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_ED_KEY}" ]]; then
            echo "::error::SPARKLE_PRIVATE_ED_KEY is required to sign updates"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          FEED_DIR="build/sparkle-feed"
          ARCHIVE="Dev-Island-${VERSION}.zip"
          GENERATOR=".build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          mkdir -p "${FEED_DIR}"
          cp "${{ steps.package.outputs.versioned }}" "${FEED_DIR}/${ARCHIVE}"

          # The repository-owned wrapper moves the key into a non-exported
          # shell buffer, removes all release credential variables, and starts
          # Sparkle with a minimal environment. The pinned generator receives
          # the private key only through --ed-key-file stdin.
          ./scripts/release/run-sparkle-appcast-generator.sh \
            "${GENERATOR}" \
            "${FEED_DIR}" \
            "${GITHUB_REF_NAME}"

          APPCAST="${FEED_DIR}/appcast.xml"
          grep -q 'sparkle:edSignature=' "${APPCAST}"
          grep -q 'sparkle-signatures:' "${APPCAST}"
          grep -q "releases/download/${GITHUB_REF_NAME}/${ARCHIVE}" "${APPCAST}"
          # Release assets are flattened to their basename by GitHub. Keep a
          # root copy so SHA256SUMS names exactly match downloaded files.
          cp "${APPCAST}" build/appcast.xml
          echo "path=build/appcast.xml" >> "${GITHUB_OUTPUT}"

      - name: Generate and verify SPDX SBOM
        id: sbom
        run: |
          set -euo pipefail
          APP='build/Dev Island.app'
          SBOM='build/Dev-Island.spdx.json'
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          swift scripts/release/generate-sbom.swift \
            --package-resolved Package.resolved \
            --version-file VERSION \
            --licenses-dir "$APP/Contents/Resources/ThirdPartyLicenses" \
            --toml-header .build/app-production/checkouts/swift-toml/Sources/CTomlPlusPlus/toml.hpp \
            --brand-manifest scripts/assets/agent-logos/manifest.json \
            --brand-source-dir scripts/assets/agent-logos \
            --brand-bundle-dir "$APP/Contents/Resources" \
            --source-revision "${GITHUB_SHA}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}" \
            --output "$SBOM"
          swift scripts/release/generate-sbom.swift \
            --package-resolved Package.resolved \
            --version-file VERSION \
            --licenses-dir "$APP/Contents/Resources/ThirdPartyLicenses" \
            --toml-header .build/app-production/checkouts/swift-toml/Sources/CTomlPlusPlus/toml.hpp \
            --brand-manifest scripts/assets/agent-logos/manifest.json \
            --brand-source-dir scripts/assets/agent-logos \
            --brand-bundle-dir "$APP/Contents/Resources" \
            --source-revision "${GITHUB_SHA}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}" \
            --check "$SBOM"
          echo "path=${SBOM}" >> "${GITHUB_OUTPUT}"

      - name: Generate release integrity manifest
        id: integrity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/release/generate-release-integrity-manifest.sh
          echo "path=build/SHA256SUMS" >> "${GITHUB_OUTPUT}"

      # Exercise the same repository-owned verifier users run after download.
      # The build directory contains intermediate files, so stage only the
      # exact eight public assets in an isolated directory first.
      - name: Verify complete release asset contract
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          VERIFY_DIR="$(mktemp -d "${RUNNER_TEMP}/dev-island-release-assets.XXXXXX")"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          for asset in \
            Dev-Island.dmg \
            "Dev-Island-${VERSION}.dmg" \
            Dev-Island.zip \
            "Dev-Island-${VERSION}.zip" \
            Dev-Island.spdx.json \
            SHA256SUMS \
            appcast.xml \
            dev-island.rb; do
            cp "build/${asset}" "${VERIFY_DIR}/${asset}"
          done
          ./scripts/release/verify-release-assets.sh \
            --tag "${GITHUB_REF_NAME}" \
            --asset-dir "${VERIFY_DIR}" \
            --source-revision "${GITHUB_SHA}"

      # GitHub stores this Sigstore-backed provenance separately from the
      # Release assets. Users can verify that a downloaded file was produced
      # by this repository's tagged workflow without trusting copied checksum
      # text in release notes.
      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.dmg.outputs.stable }}
            ${{ steps.dmg.outputs.versioned }}
            ${{ steps.package.outputs.stable }}
            ${{ steps.package.outputs.versioned }}
            ${{ steps.appcast.outputs.path }}
            ${{ steps.cask.outputs.path }}
            ${{ steps.sbom.outputs.path }}
            ${{ steps.integrity.outputs.path }}

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.dmg.outputs.stable }}
            ${{ steps.dmg.outputs.versioned }}
            ${{ steps.package.outputs.stable }}
            ${{ steps.package.outputs.versioned }}
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Dev Island ${{ steps.version.outputs.version }}
          # Body links the Cask install command directly so users landing
          # on the Releases page have a copy-paste path to install.
          body: |
            ## Install

            Download `Dev-Island.dmg` below, open it, drag `Dev Island.app`
            onto the `Applications` shortcut. Signed and notarized by Apple,
            so no Gatekeeper warning on first launch.

            (`Dev-Island.zip` contains the identical app — it exists for
            scripted downloads and the stable
            `releases/latest/download/Dev-Island.zip` URL.)

            Or, on the landing page: https://devisland.app

            ## Homebrew (optional, when the tap is published)

            ```sh
            brew tap sheepxux/dev-island
            brew install --cask dev-island
            ```

            **SHA-256**
            - `Dev-Island.dmg`: `${{ steps.dmg.outputs.sha256 }}`
            - `Dev-Island.zip`: `${{ steps.package.outputs.sha256 }}`

            `SHA256SUMS` covers every DMG/ZIP alias, the signed appcast, SPDX
            SBOM, and generated Cask. From the download directory, verify it with:

            ```sh
            shasum -a 256 -c SHA256SUMS
            ```

            GitHub also records Sigstore-backed build provenance. With the
            GitHub CLI, verify an individual artifact with:

            ```sh
            gh attestation verify Dev-Island.dmg --repo sheepxux/Dev-Island
            ```

            `Dev-Island.spdx.json` inventories the exact SwiftPM revisions and
            bundled vendored components. GitHub binds that SBOM to both DMG and
            ZIP aliases with a separate signed SBOM attestation.

            In-app updates use the signed `appcast.xml` asset below. Both the
            feed and the downloaded archive require Sparkle Ed25519 signatures.

            `dev-island.rb` is a release-pinned Cask candidate generated from
            the same version and ZIP SHA-256. Publishing it to the tap remains
            a separate reviewed action.
          files: |
            ${{ steps.dmg.outputs.stable }}
            ${{ steps.dmg.outputs.versioned }}
            ${{ steps.package.outputs.stable }}
            ${{ steps.package.outputs.versioned }}
            ${{ steps.appcast.outputs.path }}
            ${{ steps.cask.outputs.path }}
            ${{ steps.sbom.outputs.path }}
            ${{ steps.integrity.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always clean up the keychain, even if a previous step failed —
      # otherwise consecutive runs on the same self-hosted runner would
      # hit "duplicate keychain" errors.
      - name: Tear down signing keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
