<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dev Island for macOS</title>
  <desc id="desc">A restrained warm-white product composition showing Dev Island monitoring three AI agent sessions from the MacBook notch.</desc>

  <defs>
    <linearGradient id="canvas" x1="68" y1="32" x2="1129" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F3ED"/>
      <stop offset="0.56" stop-color="#F0ECE4"/>
      <stop offset="1" stop-color="#E7E1D7"/>
    </linearGradient>
    <linearGradient id="screen" x1="612" y1="78" x2="1093" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF9F5"/>
      <stop offset="1" stop-color="#E8E3DA"/>
    </linearGradient>
    <linearGradient id="island" x1="662" y1="71" x2="1057" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151513"/>
      <stop offset="1" stop-color="#080807"/>
    </linearGradient>
    <filter id="deviceShadow" x="528" y="4" width="656" height="671" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#3B352C" flood-opacity="0.18"/>
    </filter>
    <filter id="islandShadow" x="607" y="25" width="502" height="503" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <pattern id="rules" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#211F1A" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#canvas)"/>
  <rect width="1200" height="675" rx="32" fill="url(#rules)"/>
  <path d="M58 48H1142" stroke="#211F1A" stroke-opacity="0.12"/>

  <g font-family="SFMono-Regular, SF Mono, Menlo, Monaco, monospace">
    <text x="72" y="93" fill="#171613" font-size="13" font-weight="600" letter-spacing="2.2">DEV ISLAND</text>
    <text x="196" y="93" fill="#171613" fill-opacity="0.36" font-size="13" letter-spacing="1.4">/  v0.3.0</text>
  </g>

  <g font-family="New York, NewYork-Regular, Georgia, serif">
    <text x="70" y="196" fill="#11110F" font-size="62" letter-spacing="-2.2">Your agents.</text>
    <text x="70" y="266" fill="#11110F" font-size="62" letter-spacing="-2.2">One quiet island.</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, sans-serif">
    <text x="72" y="326" fill="#24221D" fill-opacity="0.64" font-size="18">Keep every session in sight from the MacBook notch.</text>
    <text x="72" y="355" fill="#24221D" fill-opacity="0.64" font-size="18">Return only when an agent needs you.</text>
  </g>

  <g font-family="SFMono-Regular, SF Mono, Menlo, Monaco, monospace" font-size="11" font-weight="600" letter-spacing="1.15">
    <rect x="72" y="406" width="86" height="34" rx="17" fill="#11110F"/>
    <text x="115" y="427" text-anchor="middle" fill="#F3EFE7">MANUS</text>
    <rect x="168" y="406" width="116" height="34" rx="17" stroke="#191813" stroke-opacity="0.24"/>
    <text x="226" y="427" text-anchor="middle" fill="#191813" fill-opacity="0.66">CLAUDE</text>
    <rect x="294" y="406" width="94" height="34" rx="17" stroke="#191813" stroke-opacity="0.24"/>
    <text x="341" y="427" text-anchor="middle" fill="#191813" fill-opacity="0.66">CODEX</text>
    <rect x="398" y="406" width="98" height="34" rx="17" stroke="#191813" stroke-opacity="0.24"/>
    <text x="447" y="427" text-anchor="middle" fill="#191813" fill-opacity="0.66">CURSOR</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, sans-serif">
    <circle cx="79" cy="504" r="4" fill="#8FB7CC"/>
    <text x="94" y="510" fill="#1E1D19" fill-opacity="0.72" font-size="14">Glanceable multi-session status</text>
    <circle cx="79" cy="542" r="4" fill="#D7A651"/>
    <text x="94" y="548" fill="#1E1D19" fill-opacity="0.72" font-size="14">Actionable attention alerts</text>
    <circle cx="79" cy="580" r="4" fill="#9AC6A9"/>
    <text x="94" y="586" fill="#1E1D19" fill-opacity="0.72" font-size="14">One-click return to source</text>
  </g>

  <g font-family="SFMono-Regular, SF Mono, Menlo, Monaco, monospace" font-size="12" letter-spacing="1.2">
    <text x="72" y="631" fill="#171613">DEVISLAND.APP</text>
    <text x="278" y="631" fill="#171613" fill-opacity="0.38">NATIVE macOS 14+</text>
  </g>

  <g filter="url(#deviceShadow)">
    <rect x="562" y="58" width="578" height="578" rx="44" fill="#D8D2C8" stroke="#171613" stroke-opacity="0.16"/>
    <rect x="580" y="76" width="542" height="542" rx="31" fill="url(#screen)"/>
    <path d="M580 514C721 432 767 523 876 493C995 460 1042 362 1122 341V618H580V514Z" fill="#D8CFC0" fill-opacity="0.58"/>
    <path d="M580 563C684 514 756 554 823 533C934 498 1008 421 1122 404V618H580V563Z" fill="#B7C1B7" fill-opacity="0.30"/>
  </g>

  <g filter="url(#islandShadow)">
    <path d="M632 76H1070V441C1070 464.196 1051.2 483 1028 483H674C650.804 483 632 464.196 632 441V76Z" fill="url(#island)"/>
    <path d="M632 76H1070" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, sans-serif">
    <text x="664" y="126" fill="#F4F1E9" fill-opacity="0.92" font-size="17" font-weight="600">Sessions</text>
    <text x="739" y="126" fill="#F4F1E9" fill-opacity="0.42" font-size="15" font-weight="600">3</text>
    <circle cx="1002" cy="119" r="3" fill="#F4F1E9" fill-opacity="0.24"/>
    <path d="M1027 119H1045M1036 110V128" stroke="#F4F1E9" stroke-opacity="0.48" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, sans-serif">
    <rect x="660" y="156" width="44" height="44" rx="12" fill="#1B1B19"/>
    <text x="682" y="183" text-anchor="middle" fill="#F1EEE7" fill-opacity="0.72" font-size="13" font-family="SFMono-Regular, SF Mono, Menlo, monospace">M</text>
    <circle cx="699" cy="195" r="4" fill="#88B8D0"/>
    <text x="720" y="174" fill="#F4F1E9" fill-opacity="0.9" font-size="16" font-weight="600">Research notch apps</text>
    <text x="720" y="197" fill="#F4F1E9" fill-opacity="0.42" font-size="13">Browsing GitHub trending</text>
    <text x="1038" y="188" text-anchor="end" fill="#F4F1E9" fill-opacity="0.38" font-size="12" font-family="SFMono-Regular, SF Mono, Menlo, monospace">03:02</text>

    <rect x="660" y="226" width="44" height="44" rx="12" fill="#1B1B19"/>
    <text x="682" y="253" text-anchor="middle" fill="#F1EEE7" fill-opacity="0.72" font-size="13" font-family="SFMono-Regular, SF Mono, Menlo, monospace">C</text>
    <circle cx="699" cy="265" r="4" fill="#D7A651"/>
    <text x="720" y="244" fill="#F4F1E9" fill-opacity="0.9" font-size="16" font-weight="600">Draft launch copy</text>
    <text x="720" y="267" fill="#D7A651" fill-opacity="0.74" font-size="13">Awaiting tone preference</text>
    <text x="1038" y="258" text-anchor="end" fill="#F4F1E9" fill-opacity="0.38" font-size="12" font-family="SFMono-Regular, SF Mono, Menlo, monospace">07:02</text>

    <rect x="660" y="296" width="44" height="44" rx="12" fill="#1B1B19"/>
    <text x="682" y="323" text-anchor="middle" fill="#F1EEE7" fill-opacity="0.72" font-size="12" font-family="SFMono-Regular, SF Mono, Menlo, monospace">&gt;_</text>
    <circle cx="699" cy="335" r="4" fill="#95C3A4"/>
    <text x="720" y="314" fill="#F4F1E9" fill-opacity="0.9" font-size="16" font-weight="600">Summarize last week’s PRs</text>
    <text x="720" y="337" fill="#F4F1E9" fill-opacity="0.42" font-size="13">Completed</text>
    <text x="1038" y="328" text-anchor="end" fill="#F4F1E9" fill-opacity="0.38" font-size="12" font-family="SFMono-Regular, SF Mono, Menlo, monospace">50:00</text>
  </g>

  <g filter="url(#islandShadow)">
    <rect x="696" y="39" width="310" height="72" rx="31" fill="#080807"/>
    <circle cx="724" cy="75" r="5" fill="#D7A651"/>
    <text x="742" y="81" fill="#F4F1E9" fill-opacity="0.76" font-size="14" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif">Waiting for approval</text>
    <text x="969" y="81" text-anchor="end" fill="#F4F1E9" fill-opacity="0.76" font-size="13" font-weight="600" font-family="SFMono-Regular, SF Mono, Menlo, monospace">1 Ⅱ</text>
  </g>

  <g font-family="SFMono-Regular, SF Mono, Menlo, Monaco, monospace">
    <text x="660" y="540" fill="#181713" fill-opacity="0.42" font-size="11" letter-spacing="1.4">CLICK A SESSION</text>
    <path d="M660 555H773" stroke="#181713" stroke-opacity="0.18"/>
    <text x="660" y="580" fill="#181713" fill-opacity="0.68" font-size="13">Return to the exact app or project.</text>
  </g>
</svg>
