<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dev Island product preview</title>
  <desc id="desc">A dark macOS-style preview showing Dev Island in the notch with a compact agent task panel.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 130) rotate(46) scale(720 520)">
      <stop stop-color="#d8f7df" stop-opacity="0.24"/>
      <stop offset="0.44" stop-color="#152019" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#020202" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="screen" x1="119" y1="115" x2="1082" y2="608" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111111"/>
      <stop offset="0.44" stop-color="#050505"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="wallpaper" x1="148" y1="146" x2="1050" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7183df"/>
      <stop offset="0.34" stop-color="#283aab"/>
      <stop offset="0.63" stop-color="#d9aa66"/>
      <stop offset="1" stop-color="#161432"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#9cffbd" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#9cffbd" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#020202"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.55"/>
  <path d="M-40 515C125 465 200 355 358 387C482 412 491 516 646 501C810 485 843 364 993 331C1097 309 1163 336 1240 383" stroke="#f2f2e8" stroke-opacity="0.12" stroke-width="90" stroke-linecap="round"/>

  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="1">
    <text x="76" y="94" fill="#f4f4ec" fill-opacity="0.96" font-size="28">Dev Island</text>
    <text x="76" y="132" fill="#f4f4ec" fill-opacity="0.58" font-size="15">A macOS notch console for AI agent tasks</text>
    <text x="76" y="586" fill="#71f2b4" fill-opacity="0.88" font-size="15">devisland.app</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="118" y="118" width="964" height="500" rx="34" fill="url(#screen)" stroke="#f4f4ec" stroke-opacity="0.16"/>
    <rect x="144" y="146" width="912" height="446" rx="24" fill="url(#wallpaper)"/>
    <path d="M144 290L390 164L1056 379V592H144V290Z" fill="#000" fill-opacity="0.24"/>
    <path d="M144 468L414 230L762 592H144V468Z" fill="#0b102e" fill-opacity="0.48"/>
    <path d="M722 146L1056 281V592H842L612 314L722 146Z" fill="#edbf75" fill-opacity="0.48"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif">
    <text x="176" y="184" fill="#fff" fill-opacity="0.76" font-size="16" font-weight="700">Dev Island</text>
    <text x="292" y="184" fill="#fff" fill-opacity="0.72" font-size="16">File</text>
    <text x="342" y="184" fill="#fff" fill-opacity="0.72" font-size="16">Edit</text>
    <text x="392" y="184" fill="#fff" fill-opacity="0.72" font-size="16">Window</text>
    <text x="948" y="184" fill="#fff" fill-opacity="0.72" font-size="16">Tue 2:46 AM</text>
  </g>

  <rect x="520" y="146" width="160" height="52" rx="0" fill="#000"/>
  <path d="M520 146H680V170C680 187.673 665.673 202 648 202H552C534.327 202 520 187.673 520 170V146Z" fill="#000"/>

  <g filter="url(#softShadow)">
    <rect x="362" y="336" width="520" height="218" rx="18" fill="#202020" fill-opacity="0.78" stroke="#f4f4ec" stroke-opacity="0.16"/>
    <rect x="362" y="336" width="520" height="46" rx="18" fill="#303030" fill-opacity="0.74"/>
    <circle cx="386" cy="359" r="7" fill="#ff7a90"/>
    <circle cx="408" cy="359" r="7" fill="#ffd166"/>
    <circle cx="430" cy="359" r="7" fill="#71f2b4"/>
    <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <circle cx="396" cy="426" r="5" fill="#71f2b4"/>
      <text x="416" y="434" fill="#f4f4ec" fill-opacity="0.9" font-size="22">Edit src/auth/middleware.ts</text>
      <text x="414" y="486" fill="#b78cff" font-size="20" font-weight="700">Edit file</text>
      <text x="414" y="522" fill="#f4f4ec" fill-opacity="0.68" font-size="18">+ if (!token) throw Waiting()</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="438" y="214" width="324" height="132" rx="18" fill="#000" fill-opacity="0.92"/>
    <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <circle cx="462" cy="244" r="5" fill="#ffd166"/>
      <text x="480" y="252" fill="#f4f4ec" fill-opacity="0.54" font-size="14">Permission Request</text>
      <text x="480" y="287" fill="#f4f4ec" font-size="20">Waiting for review</text>
      <rect x="468" y="306" width="122" height="28" rx="7" fill="#2a2a2a"/>
      <rect x="606" y="306" width="122" height="28" rx="7" fill="#f4f4ec" fill-opacity="0.92"/>
      <text x="508" y="326" fill="#f4f4ec" fill-opacity="0.76" font-size="13" text-anchor="middle">Deny</text>
      <text x="667" y="326" fill="#070707" font-size="13" text-anchor="middle">Allow</text>
    </g>
  </g>

  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" filter="url(#softShadow)">
    <rect x="392" y="72" width="416" height="58" rx="0" fill="#000"/>
    <path d="M392 72H808V96C808 114.778 792.778 130 774 130H426C407.222 130 392 114.778 392 96V72Z" fill="#000"/>
    <circle cx="428" cy="101" r="8" fill="#5b9efa"/>
    <text x="456" y="110" fill="#f4f4ec" fill-opacity="0.72" font-size="20">Running task: PR summary</text>
    <rect x="744" y="87" width="38" height="28" rx="8" fill="#f4f4ec" fill-opacity="0.14"/>
    <text x="763" y="108" fill="#f4f4ec" font-size="18" text-anchor="middle">3</text>
  </g>
</svg>
